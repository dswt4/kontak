<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubungi Aku - Anggun Deswita</title>
  <!-- Load Google Fonts: Cinzel & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom Typography & Theme Styles */
    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    .font-jakarta {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Dark Charcoal & Crimson Maroon Card Surface */
    .contact-card {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      background: linear-gradient(145deg, #161618 0%, #240c10 100%);
      border: 1px solid rgba(185, 28, 44, 0.35);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), 0 0 25px rgba(153, 27, 41, 0.12);
    }

    /* Elegant Top Crimson Accent Line */
    .contact-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #e11d48, transparent);
    }

    /* Floating Gravity Animation */
    @keyframes floatGravity {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    .gravity-btn {
      animation: floatGravity 3.5s ease-in-out infinite;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gravity-btn:nth-child(1) { animation-delay: 0s; }
    .gravity-btn:nth-child(2) { animation-delay: 0.6s; }
    .gravity-btn:nth-child(3) { animation-delay: 1.2s; }

    /* Pause floating and lift smoothly on hover */
    .gravity-btn:hover {
      animation-play-state: paused;
      background: rgba(153, 27, 41, 0.4);
      border-color: #e11d48;
      color: #ffffff;
      transform: translateY(-5px) scale(1.04);
      box-shadow: 0 8px 18px rgba(185, 28, 44, 0.38);
    }
  </style>
</head>
